<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập - Kireio</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="register.css">
</head>
<body>
<!-- Bạn copy phần <header> từ register.html dán vào đây -->

<main class="register-page">
  <section class="register-section">
    <div class="register-card max-w-md w-full bg-white rounded-2xl shadow-xl">
      <div class="register-header">
        <span class="register-eyebrow">Chào mừng trở lại</span>
        <h1>Đăng nhập Kireio</h1>
      </div>

      <form id="loginForm" class="register-form" novalidate>
        <div class="register-field">
          <label for="emailInput">Email</label>
          <input id="emailInput" name="email_dang_nhap" type="email" placeholder="ban@vidu.com" required>
        </div>

        <div class="register-field">
          <label for="passwordInput">Mật khẩu</label>
          <div class="password-wrap">
            <input id="passwordInput" name="mat_khau" type="password" placeholder="••••••••" required>
            <button type="button" class="password-toggle" id="passwordToggle">Hiện</button>
          </div>
        </div>

        <button type="submit" class="register-submit w-full" id="loginSubmit">Đăng nhập</button>
        <p class="register-message" id="loginMessage"></p>

        <p class="register-login">
          Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
        </p>
      </form>
    </div>
  </section>
</main>

<script src="login.js"></script>
</body>
</html>
